{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" action="{{ action }}" class="form">
    <label>
        Nombre
        <input type="text" name="nombre" value="{{ cliente.nombre if cliente else '' }}" required>
    </label>
    <label>
        Email
        <input type="email" name="email" value="{{ cliente.email if cliente else '' }}" required>
    </label>
    <label>
        Telefono
        <input type="text" name="telefono" value="{{ cliente.telefono if cliente else '' }}" required>
    </label>
    <div class="actions">
        <button class="btn" type="submit">Guardar</button>
        <a class="btn-outline" href="/clientes">Cancelar</a>
    </div>
</form>
{% endblock %}
