{% extends "base.html" %}
{% block content %}
<div class="list-header">
    <h1>Clientes</h1>
    <a class="btn" href="/clientes/nuevo">+ Nuevo</a>
</div>

  {% if clientes %}
<table class="table">
    <thead>
        <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Telefono</th><th></th></tr>
    </thead>
    <tbody>
        {% for c in clientes %}
        <tr>
            <td>{{ c.id }}</td>
            <td><a href="/clientes/{{ c.id }}">{{ c.nombre }}</a></td>
            <td>{{ c.email }}</td>
            <td>{{ c.telefono }}</td>
            <td><a class="btn-outline" href="/clientes/{{ c.id }}/editar">Editar</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
  {% else %}
<p>No hay clientes aun.</p>
  {% endif %}
{% endblock %}
