{% extends "base.html" %}
{% block content %}
  <div class="list-header">
    <h1>Productos</h1>
    <a class="btn" href="/productos/nuevo">+ Nuevo</a>
  </div>

  {% if productos %}
    <table class="table">
      <thead>
        <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th></th></tr>
      </thead>
      <tbody>
        {% for p in productos %}
        <tr>
          <td>{{ p.id }}</td>
          <td><a href="/productos/{{ p.id }}">{{ p.nombre }}</a></td>
          <td>{{ "%.2f"|format(p.precio) }}</td>
          <td>{{ p.stock }}</td>
          <td><a class="btn-outline" href="/productos/{{ p.id }}/editar">Editar</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No hay productos aún.</p>
  {% endif %}
{% endblock %}
