{% extends "base.html" %}
{% block content %}
  <h1>{{ title }}</h1>
  <form method="post" action="{{ action }}" class="form">
    <label>Nombre
      <input type="text" name="nombre" value="{{ producto.nombre if producto else '' }}" required>
    </label>
    <label>Descripción
      <textarea name="descripcion">{{ producto.descripcion if producto else '' }}</textarea>
    </label>
    <label>Precio
      <input type="number" step="0.01" name="precio" value="{{ producto.precio if producto else '0.00' }}" required>
    </label>
    <label>Stock
      <input type="number" name="stock" value="{{ producto.stock if producto else '0' }}" required>
    </label>
    <div class="actions">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn-outline" href="/productos">Cancelar</a>
    </div>
  </form>
{% endblock %}
